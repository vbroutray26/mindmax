name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Write google-services.json from secret (base64-encoded).
      # In GitHub → Settings → Secrets, add GOOGLE_SERVICES_JSON:
      #   base64 -i app/google-services.json | tr -d '\n'
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Using real google-services.json from secret."
          else
            sed \
              -e 's/REPLACE_WITH_PROJECT_NUMBER/000000000001/g' \
              -e 's/REPLACE_WITH_PROJECT_ID/bernardvb-dev/g' \
              -e 's/REPLACE_WITH_APP_HASH/a1b2c3d4e5f60001/g' \
              -e 's/REPLACE_WITH_API_KEY/AIzaSyDEVPLACEHOLDER000000000000000DEV0/g' \
              app/google-services.json.template > app/google-services.json
            echo "WARNING: Using placeholder google-services.json — Firebase auth will not work at runtime."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bernard-vb-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
